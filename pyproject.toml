[project]
name = "document-qa-api"
version = "0.1.0"
description = "A learning project for a PDF question-answering API using retrieval-augmented generation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pypdf",
    "langchain",
    "langchain-openai",
    "langchain-chroma",
    "langchain-text-splitters",
    "pydantic-settings",
]
